# ponytail: ambiente de dev/teste local; produção é Forge (ver CLAUDE.md §2)
services:
  app:
    build: docker/php
    # vendor/ num volume do Docker: no Windows a pasta do projeto chega no container por um
    # compartilhamento lento (9p) e o Laravel lê milhares de arquivos do vendor a cada request.
    volumes: [".:/app", "vendor:/app/backend/vendor"]
    working_dir: /app/backend
    ports: ["8000:8000"]
    environment:
      PHP_CLI_SERVER_WORKERS: 4
    depends_on: [pgsql, redis]
    command: php artisan serve --host=0.0.0.0 --port=8000
  # Processa a fila (ex.: QuoteApproved → gera a OS). Em produção: Horizon.
  queue:
    build: docker/php
    volumes: [".:/app", "vendor:/app/backend/vendor"]
    working_dir: /app/backend
    depends_on: [pgsql, redis]
    command: php artisan queue:work --tries=5
  # Worker WhatsApp. Só sobe com `docker compose --profile whatsapp up`, porque precisa das credenciais
  # da Meta em worker-whatsapp/.env (sem WHATSAPP_PHONE_NUMBER_ID no backend nada é enfileirado mesmo).
  worker-whatsapp:
    image: node:24-alpine
    profiles: [whatsapp]
    volumes: ["./worker-whatsapp:/app", "worker_node_modules:/app/node_modules"]
    working_dir: /app
    environment:
      REDIS_URL: redis://redis:6379/0
      API_URL: http://app:8000
    ports: ["3001:3001"]
    depends_on: [redis, app]
    command: sh -c "npm ci --omit=dev && npm start"
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: oficina
      POSTGRES_PASSWORD: secret
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/pgsql/init.sql:/docker-entrypoint-initdb.d/init.sql]
  redis:
    image: redis:7-alpine
volumes:
  pgdata:
  vendor:
  worker_node_modules:
